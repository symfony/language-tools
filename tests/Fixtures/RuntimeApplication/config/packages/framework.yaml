framework:
    secret: '%env(APP_SECRET)%'
    default_locale: en
    asset_mapper:
        paths:
            - '%kernel.project_dir%/assets'
    translator:
        default_path: '%kernel.project_dir%/translations'
    messenger:
        default_bus: command.bus
        buses:
            command.bus: ~
            event.bus: ~
        transports:
            async: 'in-memory://'
            failed: 'in-memory://'
        failure_transport: failed
        routing:
            App\Message\Ping: async
