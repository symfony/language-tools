framework:
    secret: '%env(APP_SECRET)%'
    default_locale: en
    asset_mapper:
        paths:
            - '%kernel.project_dir%/assets'
    translator:
        default_path: '%kernel.project_dir%/translations'
    messenger:
        default_bus: command.bus
        buses:
            command.bus: ~
            event.bus: ~
        transports:
            async:
                dsn: 'in-memory://'
                retry_strategy:
                    max_retries: '%env(int:SYMFONY_LSP_TEST_MAX_RETRIES)%'
            failed: 'in-memory://'
        failure_transport: failed
        routing:
            App\Message\Ping: async
