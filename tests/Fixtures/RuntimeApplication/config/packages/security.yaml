security:
    providers:
        fixture_users:
            memory: ~
    firewalls:
        development:
            pattern: ^/_(profiler|wdt)
            security: false
        main:
            lazy: true
            provider: fixture_users
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
    access_control:
        - path: ^/admin
          roles: ROLE_ADMIN
