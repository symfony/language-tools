name: VS Code integration

on:
    pull_request:
        paths-ignore:
            - CHANGELOG.md
            - LICENSE
            - README.md
            - SECURITY.md
            - box.json
            - docs/**
            - editor/neovim/**
    push:
        branches: [main]
        paths-ignore:
            - CHANGELOG.md
            - LICENSE
            - README.md
            - SECURITY.md
            - box.json
            - docs/**
            - editor/neovim/**
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    extension-host:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - uses: ramsey/composer-install@v4
            - name: Build the Tree-sitter extension
              run: composer tree-sitter:build
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: editor/vscode/package-lock.json
            - name: Install the compatibility application
              working-directory: tests/Fixtures/RuntimeApplication
              run: composer update --no-interaction --no-progress --with-all-dependencies
            - name: Install the VS Code extension
              working-directory: editor/vscode
              run: npm ci
            - name: Verify the self-contained package
              working-directory: editor/vscode
              run: |
                  trap 'rm -rf server' EXIT
                  mkdir -p server dist
                  printf '#!/bin/sh\nexit 0\n' > server/symfony-lsp
                  chmod +x server/*
                  npm run package -- --target linux-x64 --out dist/symfony-lsp-stable-linux-x64.vsix
                  if unzip -p dist/symfony-lsp-stable-linux-x64.vsix extension.vsixmanifest | grep -Fq 'Microsoft.VisualStudio.Code.PreRelease'; then
                      echo "Stable package contains a prerelease marker" >&2
                      exit 1
                  fi
                  npm run package -- --pre-release --target linux-x64 --out dist/symfony-lsp-prerelease-linux-x64.vsix
                  unzip -p dist/symfony-lsp-prerelease-linux-x64.vsix extension.vsixmanifest | grep -F 'Microsoft.VisualStudio.Code.PreRelease'
                  npx vsce ls | grep -Fx 'images/icon.png'
                  npx vsce ls | grep -Fx 'server/symfony-lsp'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_NOTICES.md'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/runtime/src_php-src_0.txt'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/tree-sitter/tree-sitter-twig-LICENSE'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/vscode/vscode-languageclient/LICENSE'
            - uses: actions/cache@v6
              with:
                  path: editor/vscode/.vscode-test/vscode-*
                  key: vscode-test-${{ runner.os }}-1.131.0-${{ hashFiles('editor/vscode/package-lock.json') }}
            - name: Test in VS Code
              working-directory: editor/vscode
              run: xvfb-run -a npm run test:e2e
