name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    actions: read
    contents: write

jobs:
    release:
        name: Promote release candidate
        runs-on: ubuntu-latest
        env:
            CANDIDATE_ARTIFACT: symfony-lsp-release-candidate-${{ github.ref_name }}-${{ github.sha }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Find the exact release candidate
              id: candidate
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "The release workflow must run for a vX.Y.Z[-PRERELEASE] tag." >&2
                      exit 1
                  fi
                  run_id="$(
                      gh run list \
                          --workflow=release-candidate.yaml \
                          --commit="$GITHUB_SHA" \
                          --event=workflow_dispatch \
                          --status=success \
                          --limit=100 \
                          --json=databaseId,displayTitle,headSha \
                          --jq "first(.[] | select(.headSha == \"$GITHUB_SHA\" and .displayTitle == \"Release candidate $GITHUB_REF_NAME\") | .databaseId) // empty"
                  )"
                  if [[ -z "$run_id" ]]; then
                      echo "No successful release candidate for $GITHUB_REF_NAME at $GITHUB_SHA." >&2
                      exit 1
                  fi
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            - uses: actions/download-artifact@v8
              with:
                  name: ${{ env.CANDIDATE_ARTIFACT }}
                  path: candidate
                  run-id: ${{ steps.candidate.outputs.run_id }}
                  github-token: ${{ github.token }}
            - name: Verify candidate provenance and assets
              run: |
                  assets=(
                      "symfony-lsp-$GITHUB_REF_NAME-linux-x64.tar.gz"
                      "symfony-lsp-$GITHUB_REF_NAME-linux-arm64.tar.gz"
                      "symfony-lsp-$GITHUB_REF_NAME-macos-x64.tar.gz"
                      "symfony-lsp-$GITHUB_REF_NAME-macos-arm64.tar.gz"
                      "symfony-lsp-$GITHUB_REF_NAME-windows-x64.zip"
                      "symfony-lsp-$GITHUB_REF_NAME-linux-x64.vsix"
                      "symfony-lsp-$GITHUB_REF_NAME-linux-arm64.vsix"
                      "symfony-lsp-$GITHUB_REF_NAME-darwin-x64.vsix"
                      "symfony-lsp-$GITHUB_REF_NAME-darwin-arm64.vsix"
                      "symfony-lsp-$GITHUB_REF_NAME-win32-x64.vsix"
                  )
                  expected=("${assets[@]}" SHA256SUMS RELEASE_NOTES.md RELEASE_MANIFEST.json)
                  diff \
                      <(printf '%s\n' "${expected[@]}" | sort) \
                      <(find candidate -maxdepth 1 -type f -printf '%f\n' | sort)
                  jq --exit-status \
                      --arg commit "$GITHUB_SHA" \
                      --arg version "$GITHUB_REF_NAME" \
                      '.commit == $commit and .version == $version and (keys | sort) == ["commit", "version"]' \
                      candidate/RELEASE_MANIFEST.json
                  test -s candidate/RELEASE_NOTES.md
                  (
                      cd candidate
                      test "$(wc -l < SHA256SUMS)" -eq "${#assets[@]}"
                      sha256sum --check --strict SHA256SUMS
                  )
            - uses: softprops/action-gh-release@v3
              with:
                  files: |
                      candidate/*.tar.gz
                      candidate/*.zip
                      candidate/*.vsix
                      candidate/SHA256SUMS
                  fail_on_unmatched_files: true
                  body_path: candidate/RELEASE_NOTES.md
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  draft: true
            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRERELEASE: ${{ contains(github.ref_name, '-') }}
              run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$PRERELEASE"

    marketplace:
        name: Publish VS Code extension
        needs: release
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/publish-vscode.yaml
        with:
            tag: ${{ github.ref_name }}
