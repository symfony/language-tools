name: Release candidate
run-name: Release candidate ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'dev' }}

on:
    schedule:
        - cron: '17 5 * * *'
    workflow_dispatch:
        inputs:
            version:
                description: Release reference, either dev or vX.Y.Z[-PRERELEASE]
                required: true
                default: dev
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || 'dev' }}-${{ github.sha }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: Build release candidate
        uses: ./.github/workflows/build-release.yaml
        with:
            version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'dev' }}

    marketplace:
        name: Verify extension marketplace access
        needs: build
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/publish-vscode.yaml
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'dev' }}
            verify_only: true
