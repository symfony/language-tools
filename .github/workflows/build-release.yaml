name: Build release artifacts

on:
    workflow_call:
        inputs:
            version:
                description: Release reference, either dev or vX.Y.Z[-PRERELEASE]
                required: true
                type: string

permissions:
    contents: read

jobs:
    reference:
        name: Validate release reference
        runs-on: ubuntu-latest
        outputs:
            type: ${{ steps.reference.outputs.type }}
        steps:
            - name: Validate release reference
              id: reference
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if [[ "$VERSION" = dev ]]; then
                      echo 'type=branch' >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo 'type=tag' >> "$GITHUB_OUTPUT"
                  else
                      echo "Invalid release reference: $VERSION" >&2
                      exit 1
                  fi

    unix-binaries:
        name: ${{ matrix.platform }}
        needs: reference
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-x64
                      runner: ubuntu-latest
                      spc: linux-x86_64
                      spc_checksum: 523ba4279c54c7a377156c0dd3a36adf92ee64b01e9a7f5e9e2ec084b8e458e5
                    - platform: linux-arm64
                      runner: ubuntu-24.04-arm
                      spc: linux-aarch64
                      spc_checksum: 675a3840dcdc4ed041fe20eaa54310ce019a9984c1c03951df9ec66df5795213
                    - platform: macos-x64
                      runner: macos-15-intel
                      spc: macos-x86_64
                      spc_checksum: e8b798048f62ca4960764196543b60ae703f7174aa418824cf542aeec1d2cd6a
                    - platform: macos-arm64
                      runner: macos-14
                      spc: macos-aarch64
                      spc_checksum: acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225
        env:
            REFERENCE_TYPE: ${{ needs.reference.outputs.type }}
            VERSION: ${{ inputs.version }}
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - name: Install production dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            - name: Build the server PHAR
              run: php tools/build-release-phar "$REFERENCE_TYPE" "$VERSION"
            - name: Trust the preinstalled AWS SAM formula
              if: runner.os == 'macOS'
              run: |
                  if brew tap | grep -Fxq aws/tap; then
                      brew trust --formula aws/tap/aws-sam-cli
                  fi
            - name: Download static-php-cli
              working-directory: var/build/release
              run: |
                  curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-${{ matrix.spc }}.tar.gz -o spc.tar.gz
                  echo '${{ matrix.spc_checksum }}  spc.tar.gz' | shasum -a 256 -c
                  tar -xzf spc.tar.gz
            - name: Build the standalone Linux server
              if: runner.os == 'Linux'
              env:
                  ALPINE_IMAGE: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
                  EXTENSIONS: ctype,filter,iconv,mbstring,pcntl,phar,posix,tokenizer,zlib
                  GITHUB_TOKEN: ${{ github.token }}
                  SPC_DOWNLOAD_RETRIES: 5
              run: |
                  docker run --rm \
                      --env EXTENSIONS \
                      --env GITHUB_TOKEN \
                      --env GITHUB_WORKSPACE \
                      --env SPC_DOWNLOAD_RETRIES \
                      --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
                      --workdir "$GITHUB_WORKSPACE/var/build/release" \
                      "$ALPINE_IMAGE" \
                      sh -lc '
                          apk add --no-cache bash ca-certificates curl
                          ./spc doctor --auto-fix
                          ./spc download --with-php=8.4 --for-extensions="$EXTENSIONS" --retry="$SPC_DOWNLOAD_RETRIES"
                          ./spc build "$EXTENSIONS" --build-micro -P "$GITHUB_WORKSPACE/tools/spc-inject-tree-sitter.php"
                          ./spc micro:combine ../../../build/symfony-lsp.phar -O ../../../build/symfony-lsp
                          chmod +x ../../../build/symfony-lsp
                      '
            - name: Build the standalone macOS server
              if: runner.os == 'macOS'
              working-directory: var/build/release
              env:
                  EXTENSIONS: ctype,filter,iconv,mbstring,pcntl,phar,posix,tokenizer,zlib
                  GITHUB_TOKEN: ${{ github.token }}
                  SPC_DOWNLOAD_RETRIES: 5
              run: |
                  ./spc doctor --auto-fix
                  ./spc download --with-php=8.4 --for-extensions="$EXTENSIONS" --retry="$SPC_DOWNLOAD_RETRIES"
                  ./spc build "$EXTENSIONS" --build-micro -P "$GITHUB_WORKSPACE/tools/spc-inject-tree-sitter.php"
                  ./spc micro:combine ../../../build/symfony-lsp.phar -O ../../../build/symfony-lsp
                  chmod +x ../../../build/symfony-lsp
            - name: Package and smoke-test
              env:
                  PLATFORM: ${{ matrix.platform }}
              run: php tools/package-release "$PLATFORM" "$REFERENCE_TYPE" "$VERSION"
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: spc-logs-${{ inputs.version }}-${{ matrix.platform }}
                  path: var/build/release/log/
                  if-no-files-found: ignore
                  retention-days: 7
            - uses: actions/upload-artifact@v7
              with:
                  name: symfony-lsp-${{ inputs.version }}-${{ matrix.platform }}
                  path: dist/*.tar.gz
                  if-no-files-found: error
                  retention-days: 7

    windows-binary:
        name: windows-x64
        needs: reference
        # spc 2.8.5 only detects Visual Studio 2022/2019; windows-latest ships VS 2026.
        runs-on: windows-2022
        env:
            REFERENCE_TYPE: ${{ needs.reference.outputs.type }}
            VERSION: ${{ inputs.version }}
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - name: Install production dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            - name: Build the server PHAR
              run: php tools/build-release-phar "$env:REFERENCE_TYPE" "$env:VERSION"
            - name: Build the standalone server
              shell: pwsh
              working-directory: var/build/release
              env:
                  EXTENSIONS: ctype,filter,iconv,mbstring,phar,tokenizer,zlib
                  GITHUB_TOKEN: ${{ github.token }}
                  SPC_DOWNLOAD_RETRIES: 5
              run: |
                  Invoke-WebRequest https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-windows-x64.exe -OutFile spc.exe
                  if ((Get-FileHash spc.exe -Algorithm SHA256).Hash.ToLower() -ne '425b54ab857e21409c1fd9b818899ffebabd1e2817ef0a0ed5ae8a3d9f5b463b') { throw 'Invalid static-php-cli checksum.' }
                  ./spc.exe doctor --auto-fix
                  if ($LASTEXITCODE -ne 0) { throw 'spc doctor failed.' }
                  ./spc.exe download --with-php=8.4 --for-extensions="$env:EXTENSIONS" --retry="$env:SPC_DOWNLOAD_RETRIES"
                  if ($LASTEXITCODE -ne 0) { throw 'spc download failed.' }
                  ./spc.exe build "$env:EXTENSIONS" --build-micro -P "$env:GITHUB_WORKSPACE/tools/spc-inject-tree-sitter.php"
                  if ($LASTEXITCODE -ne 0) { throw 'spc build failed.' }
                  ./spc.exe micro:combine ../../../build/symfony-lsp.phar -O ../../../build/symfony-lsp
                  if ($LASTEXITCODE -ne 0) { throw 'spc micro:combine failed.' }
            - name: Package and smoke-test
              timeout-minutes: 2
              shell: pwsh
              run: php tools/package-release windows-x64 "$env:REFERENCE_TYPE" "$env:VERSION"
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: spc-logs-${{ inputs.version }}-windows-x64
                  path: var/build/release/log/
                  if-no-files-found: ignore
                  retention-days: 7
            - uses: actions/upload-artifact@v7
              with:
                  name: symfony-lsp-${{ inputs.version }}-windows-x64
                  path: dist/*.zip
                  if-no-files-found: error
                  retention-days: 7

    vscode-extension:
        name: VS Code extension (${{ matrix.target }})
        needs: [unix-binaries, windows-binary]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-x64
                      target: linux-x64
                      executable: symfony-lsp
                    - platform: linux-arm64
                      target: linux-arm64
                      executable: symfony-lsp
                    - platform: macos-x64
                      target: darwin-x64
                      executable: symfony-lsp
                    - platform: macos-arm64
                      target: darwin-arm64
                      executable: symfony-lsp
                    - platform: windows-x64
                      target: win32-x64
                      executable: symfony-lsp.exe
        env:
            VERSION: ${{ inputs.version }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: symfony-lsp-${{ inputs.version }}-${{ matrix.platform }}
                  path: var/vscode-server
            - name: Extract the bundled server
              env:
                  EXECUTABLE: ${{ matrix.executable }}
              run: |
                  mkdir -p editor/vscode/server var/vscode-server/extracted
                  archive="$(find var/vscode-server -maxdepth 1 -type f | head -1)"
                  case "$archive" in
                      *.tar.gz)
                          tar -xzf "$archive" --strip-components=1 -C editor/vscode/server
                          ;;
                      *.zip)
                          unzip -q "$archive" -d var/vscode-server/extracted
                          find var/vscode-server/extracted -type f -name "$EXECUTABLE" -exec cp {} editor/vscode/server/ \;
                          ;;
                      *)
                          echo "Unsupported server archive: $archive" >&2
                          exit 1
                          ;;
                  esac
                  rm -rf editor/vscode/server/LICENSE editor/vscode/server/THIRD_PARTY_LICENSES editor/vscode/server/THIRD_PARTY_NOTICES.md
                  test -f "editor/vscode/server/$EXECUTABLE"
                  if [[ "$EXECUTABLE" != *.exe ]]; then chmod +x editor/vscode/server/*; fi
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: editor/vscode/package-lock.json
            - name: Build the VS Code extension
              working-directory: editor/vscode
              env:
                  EXECUTABLE: ${{ matrix.executable }}
                  TARGET: ${{ matrix.target }}
              run: |
                  npm ci
                  mkdir -p dist
                  options=(--target "$TARGET")
                  if [[ "$VERSION" == v*-* ]]; then options=(--pre-release "${options[@]}"); fi
                  npm run package -- "${options[@]}" --out "dist/symfony-lsp-$VERSION-$TARGET.vsix"
                  package_version="$(unzip -p "dist/symfony-lsp-$VERSION-$TARGET.vsix" extension/package.json | jq --raw-output .version)"
                  if [[ "$VERSION" != dev && "$package_version" != "${VERSION#v}" ]]; then
                      echo "VSIX version $package_version does not match $VERSION" >&2
                      exit 1
                  fi
                  manifest="$(unzip -p "dist/symfony-lsp-$VERSION-$TARGET.vsix" extension.vsixmanifest)"
                  if [[ "$VERSION" == v*-* ]]; then
                      grep -Fq 'Microsoft.VisualStudio.Code.PreRelease' <<< "$manifest"
                  elif grep -Fq 'Microsoft.VisualStudio.Code.PreRelease' <<< "$manifest"; then
                      echo "Stable release contains a prerelease VSIX" >&2
                      exit 1
                  fi
                  npx vsce ls | grep -Fx 'images/icon.png'
                  npx vsce ls | grep -Fx "server/$EXECUTABLE"
                  npx vsce ls | grep -Fx 'THIRD_PARTY_NOTICES.md'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/runtime/src_php-src_0.txt'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/tree-sitter/tree-sitter-twig-LICENSE'
                  npx vsce ls | grep -Fx 'THIRD_PARTY_LICENSES/vscode/vscode-languageclient/LICENSE'
            - uses: actions/upload-artifact@v7
              with:
                  name: symfony-lsp-${{ inputs.version }}-vscode-${{ matrix.target }}
                  path: editor/vscode/dist/*.vsix
                  if-no-files-found: error
                  retention-days: 7

    bundle:
        name: Bundle release candidate
        needs: vscode-extension
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ inputs.version }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  pattern: symfony-lsp-${{ inputs.version }}-*
                  path: dist
                  merge-multiple: true
            - name: Assemble the candidate bundle
              run: |
                  assets=(
                      "symfony-lsp-$VERSION-linux-x64.tar.gz"
                      "symfony-lsp-$VERSION-linux-arm64.tar.gz"
                      "symfony-lsp-$VERSION-macos-x64.tar.gz"
                      "symfony-lsp-$VERSION-macos-arm64.tar.gz"
                      "symfony-lsp-$VERSION-windows-x64.zip"
                      "symfony-lsp-$VERSION-linux-x64.vsix"
                      "symfony-lsp-$VERSION-linux-arm64.vsix"
                      "symfony-lsp-$VERSION-darwin-x64.vsix"
                      "symfony-lsp-$VERSION-darwin-arm64.vsix"
                      "symfony-lsp-$VERSION-win32-x64.vsix"
                  )
                  test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "${#assets[@]}"
                  mkdir release-candidate
                  for asset in "${assets[@]}"; do
                      test -f "dist/$asset"
                      cp "dist/$asset" release-candidate/
                  done
                  (
                      cd release-candidate
                      sha256sum "${assets[@]}" | sort -k2
                  ) > release-candidate/SHA256SUMS
                  if [[ "$VERSION" = dev ]]; then
                      awk '
                          /^## Unreleased$/ { found = 1 }
                          found && count > 0 && /^## / { exit }
                          found { print; ++count }
                          END { if (!found) exit 1 }
                      ' CHANGELOG.md > release-candidate/RELEASE_NOTES.md
                  else
                      ./tools/release-notes "$VERSION" > release-candidate/RELEASE_NOTES.md
                  fi
                  jq --null-input \
                      --arg commit "$GITHUB_SHA" \
                      --arg version "$VERSION" \
                      '{commit: $commit, version: $version}' \
                      > release-candidate/RELEASE_MANIFEST.json
            - uses: actions/upload-artifact@v7
              with:
                  name: symfony-lsp-release-candidate-${{ inputs.version }}-${{ github.sha }}
                  path: release-candidate/*
                  if-no-files-found: error
                  retention-days: 30
