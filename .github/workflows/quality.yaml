name: PHP quality

on:
    pull_request:
        paths-ignore:
            - CHANGELOG.md
            - LICENSE
            - README.md
            - SECURITY.md
            - box.json
            - editor/neovim/**
            - editor/vscode/images/**
            - editor/vscode/src/**
            - editor/vscode/test/**
            - editor/vscode/*.md
    push:
        branches: [main]
        paths-ignore:
            - CHANGELOG.md
            - LICENSE
            - README.md
            - SECURITY.md
            - box.json
            - editor/neovim/**
            - editor/vscode/images/**
            - editor/vscode/src/**
            - editor/vscode/test/**
            - editor/vscode/*.md
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - uses: ramsey/composer-install@v4
            - name: Install the runtime fixture
              run: composer runtime-fixture:install
            - name: Build the Tree-sitter extension
              run: composer tree-sitter:build
            - name: Run unit tests
              run: composer test
            - name: Benchmark runtime refreshes
              run: composer runtime-refresh:benchmark
            - name: Benchmark source index scaling
              run: composer source-index:benchmark
            - name: Run static analysis
              run: composer phpstan
            - name: Check coding standards
              run: composer cs-check
